<svg xmlns="http://www.w3.org/2000/svg" width="880" height="640" viewBox="0 0 880 640" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare Tunnel 添加 Published application 路由(示意)</title>
  <desc id="desc">Hostname 填子域名并选择域名,Path 留空,Service URL 填 http://127.0.0.1 加 xray 本地端口。</desc>
  <rect width="880" height="640" fill="#fafafa"/>
  <rect x="20" y="15" width="840" height="605" rx="22" fill="#fff" stroke="#dedede" stroke-width="2"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif" fill="#1f2328">
    <text x="56" y="70" font-size="25" font-weight="600">Add route</text>
    <text x="56" y="100" font-size="16" fill="#777">Networking → Tunnels → 选中 tunnel → Routes → Add route → Published application</text>

    <text x="56" y="150" font-size="18" font-weight="600">Hostname</text>
    <text x="56" y="178" font-size="15" fill="#777">Subdomain</text>
    <rect x="56" y="188" width="300" height="52" rx="10" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="74" y="221" font-size="19">ws</text>
    <text x="380" y="178" font-size="15" fill="#777">Domain</text>
    <rect x="380" y="188" width="444" height="52" rx="10" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="398" y="221" font-size="19">example.com</text>
    <path d="m790 210 6 6 6-6" fill="none" stroke="#777" stroke-width="2"/>

    <text x="56" y="282" font-size="15" fill="#777">Path(可选)</text>
    <rect x="56" y="292" width="768" height="52" rx="10" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="74" y="325" font-size="17" fill="#aaa">留空 —— ws 路径由 xray 自己校验</text>

    <rect x="38" y="368" width="804" height="130" rx="4" fill="none" stroke="#ff565b" stroke-width="5"/>
    <text x="56" y="404" font-size="18" font-weight="600">Service URL</text>
    <rect x="56" y="420" width="768" height="56" rx="10" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="74" y="456" font-size="20" font-family="Menlo, monospace">http://127.0.0.1:11001</text>

    <text x="56" y="538" font-size="15" fill="#777">端口换成节点详情里的「本地端口」;不要写 localhost(可能解析成 ::1 连不上)。</text>
    <rect x="664" y="556" width="160" height="46" rx="10" fill="#f38020"/>
    <text x="744" y="586" font-size="18" fill="#fff" text-anchor="middle" font-weight="600">Add route</text>
  </g>
</svg>
