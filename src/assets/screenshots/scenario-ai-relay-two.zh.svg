<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d97757"/></marker>
</defs>
<rect x="1" y="1" width="758" height="278" rx="14" fill="#faf7f4" stroke="#e7ddd4"/>
<rect x="24" y="112" width="120" height="60" rx="10" fill="#ffffff" stroke="#8a7f78" stroke-width="1.6"/><text x="84.0" y="147.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2622">客户端</text><rect x="210" y="50" width="200" height="64" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.6"/><text x="310.0" y="78.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2622">全中转</text><text x="310.0" y="97.0" text-anchor="middle" font-size="12" fill="#7a6f68">路由出站子节点</text><rect x="210" y="170" width="200" height="64" rx="10" fill="#ffffff" stroke="#d97757" stroke-width="1.6"/><text x="310.0" y="198.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2622">AI 中转</text><text x="310.0" y="217.0" text-anchor="middle" font-size="12" fill="#7a6f68">线路 A 原节点</text><rect x="560" y="40" width="176" height="100" rx="10" fill="#ffffff" stroke="#8a7f78" stroke-width="1.6"/><text x="648.0" y="86.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2622">落地机 SS</text><text x="648.0" y="105.0" text-anchor="middle" font-size="12" fill="#7a6f68">出口 IP = 落地机</text><rect x="560" y="180" width="176" height="64" rx="10" fill="#ffffff" stroke="#8a7f78" stroke-width="1.6"/><text x="648.0" y="208.0" text-anchor="middle" font-size="15" font-weight="600" fill="#2b2622">线路 A 自身出口</text><text x="648.0" y="227.0" text-anchor="middle" font-size="12" fill="#7a6f68">出口 IP = 线路 A</text><path d="M144 142 H177 V82 H206" fill="none" stroke="#8a7f78" stroke-width="1.6" marker-end="url(#a)"/><path d="M144 142 H177 V202 H206" fill="none" stroke="#8a7f78" stroke-width="1.6" marker-end="url(#a)"/><path d="M410 82 H556" fill="none" stroke="#8a7f78" stroke-width="1.6" marker-end="url(#a)"/><text x="483" y="74" text-anchor="middle" font-size="12" fill="#7a6f68">全部流量</text><path d="M410 192 H500 V118 H556" fill="none" stroke="#d97757" stroke-width="1.6" marker-end="url(#b)"/><text x="508" y="162" text-anchor="start" font-size="12" fill="#d97757">仅 AI 域名</text><path d="M410 216 H556" fill="none" stroke="#8a7f78" stroke-width="1.6" marker-end="url(#a)"/><text x="483" y="232" text-anchor="middle" font-size="12" fill="#7a6f68">其余流量</text><text x="380" y="266" text-anchor="middle" font-size="12" fill="#7a6f68">两个节点共用线路 A 的同一个入站</text>
