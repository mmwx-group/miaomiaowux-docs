<svg xmlns="http://www.w3.org/2000/svg" width="880" height="720" viewBox="0 0 880 720" role="img" aria-labelledby="title desc">
  <title id="title">Cloudflare CDN 三处设置(示意)</title>
  <desc id="desc">DNS 记录开启 Proxied,SSL/TLS 加密模式选 Full (strict),Network 里 WebSockets 保持开启。</desc>
  <rect width="880" height="720" fill="#fafafa"/>
  <g font-family="Arial, 'Noto Sans SC', sans-serif" fill="#1f2328">
    <rect x="20" y="15" width="840" height="190" rx="18" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="48" y="58" font-size="21" font-weight="600">① DNS → Records</text>
    <g font-size="15" fill="#777"><text x="48" y="100">Type</text><text x="140" y="100">Name</text><text x="330" y="100">Content</text><text x="560" y="100">Proxy status</text></g>
    <rect x="40" y="114" width="800" height="62" rx="8" fill="#fff7ef" stroke="#f3d3b5"/>
    <g font-size="18"><text x="48" y="152">A</text><text x="140" y="152">ws</text><text x="330" y="152" font-family="Menlo, monospace">203.0.113.9</text></g>
    <path d="M572 158 a14 14 0 0 1 4-27 a18 18 0 0 1 33-4 a12 12 0 0 1 18 13 a10 10 0 0 1-2 18z" fill="#f38020"/>
    <text x="640" y="152" font-size="18" fill="#f38020" font-weight="600">Proxied</text>

    <rect x="20" y="225" width="840" height="290" rx="18" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="48" y="268" font-size="21" font-weight="600">② SSL/TLS → Overview → 加密模式</text>
    <g font-size="18">
      <circle cx="62" cy="310" r="9" fill="none" stroke="#aaa" stroke-width="2"/><text x="84" y="316">Off (no encryption)</text>
      <circle cx="62" cy="352" r="9" fill="none" stroke="#aaa" stroke-width="2"/><text x="84" y="358">Flexible</text>
      <circle cx="62" cy="394" r="9" fill="none" stroke="#aaa" stroke-width="2"/><text x="84" y="400">Full</text>
      <rect x="40" y="418" width="800" height="60" rx="8" fill="none" stroke="#ff565b" stroke-width="4"/>
      <circle cx="62" cy="448" r="9" fill="none" stroke="#f38020" stroke-width="2"/><circle cx="62" cy="448" r="5" fill="#f38020"/>
      <text x="84" y="454" font-weight="600">Full (strict)</text>
      <text x="230" y="454" font-size="15" fill="#777">源站要有有效证书(可用 Origin CA 证书)</text>
    </g>

    <rect x="20" y="535" width="840" height="160" rx="18" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="48" y="578" font-size="21" font-weight="600">③ Network</text>
    <text x="48" y="630" font-size="19">WebSockets</text>
    <text x="48" y="660" font-size="15" fill="#777">允许经 Cloudflare 代理的 WebSocket 连接</text>
    <rect x="740" y="604" width="74" height="38" rx="19" fill="#f38020"/>
    <circle cx="795" cy="623" r="15" fill="#fff"/>
    <text x="700" y="630" font-size="17" fill="#f38020" text-anchor="end" font-weight="600">On</text>
  </g>
</svg>
