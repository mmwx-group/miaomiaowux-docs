<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="title desc">
  <title id="title">XHTTP 分离(REALITY + CDN)的流量路径</title>
  <desc id="desc">上行:客户端经 CDN 到服务器 nginx 的 CDN 站点,再转到只听本机的 XHTTP 入站;下行:客户端直连服务器上的 REALITY 入口,回落到 nginx 的本机入口,再转进同一个 XHTTP 入站。两条路都由 nginx 写入真实来源 IP。</desc>
  <rect width="880" height="400" fill="#fafafa"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8a8f98"/></marker>
  </defs>
  <g font-family="Arial, 'Noto Sans SC', sans-serif" fill="#1f2328">
    <rect x="20" y="150" width="130" height="96" rx="14" fill="#fff" stroke="#dedede" stroke-width="2"/>
    <text x="85" y="192" font-size="19" text-anchor="middle" font-weight="600">客户端</text>
    <text x="85" y="218" font-size="13" fill="#777" text-anchor="middle">一个 XHTTP 会话</text>

    <rect x="210" y="40" width="200" height="90" rx="14" fill="#fff7ef" stroke="#f38020" stroke-width="2"/>
    <text x="226" y="74" font-size="17" font-weight="600">CDN(开代理)</text>
    <text x="226" y="100" font-size="13" fill="#555">cdn.example.com</text>
    <text x="226" y="118" font-size="13" fill="#555">回源到服务器 443</text>

    <rect x="210" y="266" width="200" height="90" rx="14" fill="#eef6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="226" y="300" font-size="17" font-weight="600">REALITY 入口</text>
    <text x="226" y="326" font-size="13" fill="#555">服务器 IP:REALITY 端口</text>
    <text x="226" y="344" font-size="13" fill="#555">回落带 PROXY protocol</text>

    <rect x="470" y="40" width="190" height="316" rx="14" fill="#fff" stroke="#8a8f98" stroke-width="2"/>
    <text x="565" y="74" font-size="17" text-anchor="middle" font-weight="600">nginx</text>
    <text x="565" y="104" font-size="13" text-anchor="middle" fill="#555">CDN 站点(443)</text>
    <text x="565" y="122" font-size="13" text-anchor="middle" fill="#555">与 WSS 共用站点与证书</text>
    <text x="565" y="300" font-size="13" text-anchor="middle" fill="#555">本机 h2c 入口</text>
    <text x="565" y="318" font-size="13" text-anchor="middle" fill="#555">从 PROXY protocol 取来源 IP</text>
    <text x="565" y="206" font-size="13" text-anchor="middle" fill="#2e7d4f">两条路都写入</text>
    <text x="565" y="224" font-size="13" text-anchor="middle" fill="#2e7d4f">真实来源 IP</text>

    <rect x="720" y="150" width="140" height="96" rx="14" fill="#fff" stroke="#2e7d4f" stroke-width="2"/>
    <text x="790" y="186" font-size="16" text-anchor="middle" font-weight="600">XHTTP 入站</text>
    <text x="790" y="212" font-size="13" text-anchor="middle" fill="#2e7d4f">只听 127.0.0.1</text>
    <text x="790" y="230" font-size="12" text-anchor="middle" fill="#777">端口与 path 自动生成</text>

    <g stroke="#8a8f98" stroke-width="2" fill="none" marker-end="url(#a)">
      <path d="M150 180 C180 160 185 110 206 95"/>
      <path d="M410 85 L466 85"/>
      <path d="M660 110 C690 120 700 160 716 180"/>
      <path d="M150 216 C180 236 185 290 206 305"/>
      <path d="M410 311 L466 311"/>
      <path d="M660 290 C690 280 700 240 716 220"/>
    </g>
    <text x="160" y="140" font-size="14" font-weight="600" fill="#f38020">上行</text>
    <text x="160" y="266" font-size="14" font-weight="600" fill="#3b82f6">下行</text>
  </g>
</svg>
